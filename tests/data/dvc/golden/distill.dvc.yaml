# Auto-generated by 'nanoplm data from-yaml' / 'nanoplm data get-yaml'.
# Do not edit by hand.
vars:
- distillation_data.yaml
stages:
  get_file:
    deps:
    - <PKG>/data/preparation/downloader.py
    outs:
    - ${data_dirs.compressed_fasta}
    cmd: nanoplm data get-file --url "${data_dirs.url}" -o ${data_dirs.compressed_fasta}
    params:
    - distillation_data.yaml:
      - data_dirs.url
      - data_dirs.compressed_fasta
  extract:
    cmd: nanoplm data extract -i ${data_dirs.compressed_fasta} -o ${data_dirs.extracted_fasta}
    deps:
    - ${data_dirs.compressed_fasta}
    - <PKG>/data/preparation/extractor.py
    params:
    - distillation_data.yaml:
      - data_dirs.extracted_fasta
    outs:
    - ${data_dirs.extracted_fasta}
  check:
    cmd: nanoplm data check -i ${data_dirs.extracted_fasta} -o ${data_dirs.validation_dir}
      --drop-invalid ${data_params.drop_invalid_sequences}
    deps:
    - ${data_dirs.extracted_fasta}
    - <PKG>/data/preparation/checker.py
    - <PKG>/data/preparation/csrc/fast_fasta_ops.c
    params:
    - distillation_data.yaml:
      - data_dirs.validation_dir
      - data_params.drop_invalid_sequences
    outs:
    - ${data_dirs.validation_dir}
  shuffle:
    cmd: nanoplm data shuffle -i ${data_dirs.extracted_fasta} -o ${data_dirs.shuffled_fasta}
      --shuffle ${data_params.shuffle} --seed ${data_params.shuffle_seed}
    deps:
    - ${data_dirs.extracted_fasta}
    - ${data_dirs.validation_dir}
    - <PKG>/data/preparation/shuffler.py
    - <PKG>/data/preparation/_native_ops.py
    - <PKG>/data/preparation/csrc/fast_fasta_ops.c
    params:
    - distillation_data.yaml:
      - data_dirs.shuffled_fasta
      - data_params.shuffle
      - data_params.shuffle_seed
    outs:
    - ${data_dirs.shuffled_fasta}
  filter:
    cmd: nanoplm data filter -i ${data_dirs.shuffled_fasta} -o ${data_dirs.filtered_fasta}
      --min-seq-len ${data_params.min_seq_len} --max-seq-len ${data_params.max_seq_len}
      --seqs-num ${data_params.seqs_num} --exclude-ids ${data_dirs.validation_dir}/invalid_ids.txt
    deps:
    - ${data_dirs.shuffled_fasta}
    - ${data_dirs.validation_dir}
    - <PKG>/data/preparation/filterer.py
    - <PKG>/data/preparation/_native_ops.py
    - <PKG>/data/preparation/csrc/fast_fasta_ops.c
    params:
    - distillation_data.yaml:
      - data_dirs.filtered_fasta
      - data_params.min_seq_len
      - data_params.max_seq_len
      - data_params.seqs_num
      - data_params.drop_invalid_sequences
    outs:
    - ${data_dirs.filtered_fasta}
  split:
    cmd: nanoplm data split -i ${data_dirs.filtered_fasta} -o ${data_dirs.splitted_fasta_dir}
      --val-ratio ${data_params.val_ratio}
    deps:
    - ${data_dirs.filtered_fasta}
    - <PKG>/data/preparation/splitor.py
    - <PKG>/data/preparation/_native_ops.py
    - <PKG>/data/preparation/csrc/fast_fasta_ops.c
    params:
    - distillation_data.yaml:
      - data_dirs.splitted_fasta_dir
      - data_params.val_ratio
    outs:
    - ${data_dirs.splitted_fasta_dir}
  kd-embed:
    foreach:
      train:
        input: ${data_dirs.splitted_fasta_dir}/train.fasta
        outdir: ${data_dirs.output_dir}/train
      val:
        input: ${data_dirs.splitted_fasta_dir}/val.fasta
        outdir: ${data_dirs.output_dir}/val
    do:
      cmd: nanoplm data kd-embed -i ${item.input} -o ${item.outdir} --teacher-model
        ${data_params.teacher_model} --max-seq-len ${data_params.max_seq_len} --samples-per-shard
        ${data_params.samples_per_shard} --batch-size ${data_params.embed_calc_batch_size}
      deps:
      - ${item.input}
      - <PKG>/data/sharding/distill_shard_writer.py
      params:
      - distillation_data.yaml:
        - data_dirs.output_dir
        - data_params.teacher_model
        - data_params.max_seq_len
        - data_params.samples_per_shard
        - data_params.embed_calc_batch_size
      outs:
      - ${item.outdir}
  write_manifest:
    cmd: nanoplm data write-manifest --kind distillation -o ${data_dirs.output_dir}
      --min-seq-len ${data_params.min_seq_len} --max-seq-len ${data_params.max_seq_len}
      --val-ratio ${data_params.val_ratio} --samples-per-shard ${data_params.samples_per_shard}
      --teacher-model ${data_params.teacher_model}
    deps:
    - ${data_dirs.output_dir}/train
    - ${data_dirs.output_dir}/val
    - <PKG>/data/infra/manifest.py
    params:
    - distillation_data.yaml:
      - data_params.min_seq_len
      - data_params.max_seq_len
      - data_params.val_ratio
      - data_params.samples_per_shard
      - data_params.teacher_model
    outs:
    - ${data_dirs.output_dir}/.data_manifest
