# Evaluation configuration for nanoPLM
#
# Runs biotrainer's autoeval pipeline on a pure-torch nanoPLM checkpoint.
# Requires:  pip install nanoplm[eval]   (biotrainer 2.0.0)
#
# The model config is loaded from <checkpoint_dir>/model_config.yaml.
# Checkpoints without that file are not supported.

eval:
  # Checkpoint path. Accepts a checkpoint-* directory or a run-*
  # directory (the latest checkpoint inside the run-* is used).
  checkpoint_dir: "output/pretraining_checkpoints/run-1/checkpoint-1"

  # One or more of: pgym, pbc_zeroshot_contact. Both are zero-shot —
  # 'pgym' scores ProteinGym DMS variants, 'pbc_zeroshot_contact'
  # predicts contact maps from the categorical Jacobian.
  framework: [pgym]

  output_dir: "autoeval_output"

  # device: cuda                     # auto-detected when omitted
  # embedder_name: my-run            # defaults to checkpoint dir stem

  # Zero-shot scoring method for the 'pgym' framework.
  zero_shot_method: masked_marginals  # masked_marginals | wt_marginals | pseudoperplexity

  # Sequences per forward pass. Masked-marginals masks one position at a time;
  # this batches that many masked positions into a single forward.
  zero_shot_batch_size: 60

  # Subsampled task sets (fast) vs the full benchmark (final numbers).
  development_mode: true

  # Pre-downloaded benchmark datasets, for machines without internet access.
  # Mutually exclusive with force_download.
  # dataset_dir: "/path/to/biotrainer-autoeval-data"

  # Re-download framework datasets (use when new tasks land upstream).
  force_download: false

  # Refinement depth override for a looped checkpoint.
  loop_count: null                    # null = the depth it was trained at
