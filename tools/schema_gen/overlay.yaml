# tools/schema_gen/overlay.yaml
# Hand-authored annotations the default literals cannot express.
#
# Two namespaces live in this file:
#
#  1. Flat field annotations, keyed "<section>.<field>" (a bare "<field>" for a
#     top-level scalar or a section itself). Any of: enum, minimum, maximum,
#     backend, advanced, auto_computed, type, items, group, default, description;
#     a section may also set `map: true` (see the data block).
#     A field whose template default is `null` MUST set `type` to a nullable
#     union (e.g. `type: [integer, "null"]`); emit.py refuses to guess one.
#     Every enum below is transcribed from the authoritative validator: the
#     `click.Choice(...)` in src/nanoplm/cli/*.py and/or the dataclass
#     `__post_init__` check. Never from prose.
#
#  2. The reserved top-level key `x-extra-fields` (bottom of this file): real
#     user-settable config fields the get-yaml templates ship COMMENTED OUT, so
#     the template parser cannot see them. It is NOT a "<section>.<field>"
#     annotation; see the block comment above it.

# ---------------------------------------------------------------- pretraining
# click.Choice --optimizer
pretraining.optimizer:
  enum: [adamw, stable_adamw, muon, normuon, nordion2]
# click.Choice --lr-schedule + _validate_duration_config's `valid` set
pretraining.lr_schedule:
  enum: [wsd, warmup_stable, cosine, linear]
# _normalize_distributed_mode -> {fsdp, hsdp, ddp}
pretraining.distributed_mode:
  enum: [fsdp, hsdp, ddp]
pretraining.fsdp_shard_granularity:
  enum: [layer, sublayer]
# click.Choice --decay-shape
pretraining.decay_shape:
  enum: ["1-sqrt", linear]
# click.Choice --muon-adjust-lr + __post_init__ -> {rms_norm, spectral_norm, none}
pretraining.muon_adjust_lr:
  enum: [rms_norm, spectral_norm, "none"]
# click.Choice --nordion2-selection-scope + __post_init__ -> {local, global}
pretraining.nordion2_selection_scope:
  enum: [local, global]
# click.Choice --mlm-masking-strategy + __post_init__ -> {token, span}
pretraining.mlm_masking_strategy:
  enum: [token, span]

# FP8 recipe knobs (recipe/format/amax are Transformer-Engine constructs, read
# by fp8.py's te_fp8_recipe_from_config on the pure-torch path).
pretraining.fp8_recipe:
  enum: [delayed, current, block, mxfp8, nvfp4]
  backend: [pure_torch]
pretraining.fp8_format:
  enum: [hybrid, e4m3]
  backend: [pure_torch]
pretraining.fp8_amax_history_len: { backend: [pure_torch], advanced: true }
pretraining.fp8_reduce_amax: { backend: [pure_torch], advanced: true }
# More FP8 knobs. fp8_target gets NO enum on purpose: any
# COMBINATION of mlp / attn_wqkv / attn_wo is legal (_normalize_fp8_targets),
# so a closed value list would be a lie.
pretraining.fp8_target: { backend: [pure_torch] }
pretraining.fp8_skip_last_n_layers: { backend: [pure_torch] }
pretraining.fp8_cpu_activation_offload: { backend: [pure_torch], advanced: true }
pretraining.fp8_cpu_activation_offload_layers: { backend: [pure_torch], advanced: true }
pretraining.fp8_cpu_activation_offload_retain_buffers: { backend: [pure_torch], advanced: true }

# torch.compile / TorchInductor knobs: pure-torch pipeline only.
pretraining.use_compile_max_autotune: { backend: [pure_torch], advanced: true }
pretraining.compile_triton_persistent_reductions: { backend: [pure_torch], advanced: true }
pretraining.compile_triton_mix_order_reduction: { backend: [pure_torch], advanced: true }

# Layerwise debug metrics (in-graph taps) exist only on the pure-torch path.
pretraining.debug_layerwise_metrics: { backend: [pure_torch], advanced: true }
pretraining.debug_layerwise_log_every: { backend: [pure_torch], advanced: true }

# RePO exists only on the pure-torch path.
pretraining.repo_rope_warmup_steps: { backend: [pure_torch], advanced: true }

# Huginn-style recycling: pure-torch only (ProtModernBertMLM rejects
# recycling_loop_count > 1). Enums come from
# pretraining/recycling/scheduler.py's validators.
pretraining.recycling_bptt: { backend: [pure_torch], advanced: true }
pretraining.recycling_loop_count_sampling:
  enum: [fixed, lognormal_poisson]
  backend: [pure_torch]
  advanced: true
pretraining.recycling_loop_count_sigma: { backend: [pure_torch], advanced: true }
pretraining.recycling_loop_count_curriculum:
  enum: ["none", linear, "1_sqrt"]
  backend: [pure_torch]
  advanced: true
pretraining.recycling_loop_count_curriculum_steps: { backend: [pure_torch], advanced: true }
pretraining.recycling_pretraining_eval_loop_counts:
  type: [array, "null"]
  items: { type: integer }
  backend: [pure_torch]
  advanced: true

# Loopie stochastic depth: only meaningful with model.use_loopie, pure-torch only.
pretraining.loopie_loop_count_jitter: { backend: [pure_torch], advanced: true, minimum: 0 }

# NOBLE LR scaling: only meaningful with model.use_noble, which is pure-torch only.
pretraining.noble_base_lr: { backend: [pure_torch], advanced: true }
pretraining.noble_lr_gamma: { backend: [pure_torch], advanced: true }
pretraining.noble_lr_gamma_M: { backend: [pure_torch], advanced: true }
pretraining.noble_freq_lr_mult: { backend: [pure_torch], advanced: true }
pretraining.noble_phase_lr_mult: { backend: [pure_torch], advanced: true }

# auto-computed / not user-facing (documented as such, excluded from form):
pretraining.world_size: { auto_computed: false }   # 'auto' allowed, keep visible

# --------------------------------------------------------------------- resume
# click.Choice --resume-mode + _validate_resume_config_modes
resume.mode:
  enum: [continue, decay]
# _load_resume_config's decay_shape check
resume.decay_shape:
  enum: ["1-sqrt", linear]

# ---------------------------------------------------------------------- model
model.norm_type:
  enum: [layernorm, rmsnorm]
model.classifier_activation:
  enum: [relu, gelu, srelu]
model.mlp_activation:
  enum: [swiglu, geglu, srelu]
# ModernBertConfig.__post_init__ / click.Choice --wo-init
model.wo_init:
  enum: [kaiming, zero]
# click.Choice --activation-checkpointing-mode
model.activation_checkpointing_mode:
  enum: [layer, attn, attn+mlp]
# _resolve_canon_kernel_size -> {3, 5, 7}
model.canon_layers_kernel_size:
  enum: [3, 5, 7]
  backend: [pure_torch]
  advanced: true
model.canon_layers_mode: { backend: [pure_torch], advanced: true }
model.use_canon_layers: { backend: [pure_torch], advanced: true }
model.use_repo: { backend: [pure_torch], advanced: true }
model.use_mhc_lite: { backend: [pure_torch], advanced: true }
model.mhc_lite_wrapping_level:
  enum: [layer, sublayers]
  backend: [pure_torch]
  advanced: true
model.use_diff_attn_v2: { backend: [pure_torch], advanced: true }
model.use_paired_head_attention: { backend: [pure_torch], advanced: true }
model.use_noble: { backend: [pure_torch], advanced: true }
# _NOBLE_TARGET_ROLES in models/modern_bert/config.py
model.noble_targets:
  enum: [all, attn, ffn, qkv, out]
  backend: [pure_torch]
  advanced: true
model.use_moe: { backend: [pure_torch], advanced: true }
model.recycling_loop_count: { backend: [pure_torch], advanced: true }
model.use_huginn_looping: { backend: [pure_torch], advanced: true }
model.use_loopie: { backend: [pure_torch], advanced: true }
model.loopie_loop_count: { backend: [pure_torch], advanced: true }
# ModernBertConfig.__post_init__: None (full BPTT) or int >= 1.
model.loopie_bptt: { type: [integer, "null"], minimum: 1, backend: [pure_torch], advanced: true }

# ----------------------------------------------------------------------- data
# A bare key annotates a top-level entry of the file. `map: true` marks a
# section whose keys are names the user picks, each holding a spec: the
# template's fields under its example entry (`swissprot:`) describe every entry,
# and are emitted as the section's additionalProperties.
sources:
  map: true
  description: >-
    One entry per source, keyed by a name you pick (letters, digits and _). Each
    names a fasta to build from or a prepared folder. Any data_params field set on
    a source overrides the default for that source. Only one source is supported
    for now.
# data_config._weight: optional; with one source it must be 1
sources.weight:
  default: 1.0
  description: >-
    Share of training sequences (not tokens) drawn from this source. Weights must
    sum to 1; with one source it is 1 or left out.
# data_config.PARAM_FIELDS order; the template's plain `# Rarely changed`
# heading opens this block.
data_params.shuffle: { group: Rarely changed }
data_params.shuffle_seed: { group: Rarely changed }
data_params.samples_per_shard: { group: Rarely changed }
data_params.max_workers: { group: Rarely changed }
data_params.register_tokens: { group: Rarely changed }

# --------------------------------------------------------------- distillation
# Optional[int]; null = MHA. The flat key also matches the pretrain template's
# model.num_kv_heads (default 8), which takes null the same way.
model.num_kv_heads: { type: [integer, "null"], minimum: 1 }
distillation.optimizer:
  enum: [adamw, muon, normuon]
distillation.lr_scheduler:
  enum: [cosine, linear, polynomial, constant]

# ----------------------------------------------------------------------- eval
eval.zero_shot_method:
  enum: [masked_marginals, wt_marginals, pseudoperplexity]
eval.loop_count: { backend: [pure_torch], advanced: true, minimum: 1 }
# Both also take a bare string; null keeps the datasets default.
eval.framework: { type: [array, string], items: { type: string } }
eval.pbc_supervised_datasets: { type: [array, string, "null"], items: { type: string } }

# =============================================================================
# x-extra-fields: RESERVED KEY (not a "<section>.<field>" annotation).
#
# Real, user-settable config fields that the `get-yaml` templates deliberately
# ship COMMENTED OUT, so templates.parse_fields() cannot see them. They cannot
# just be uncommented upstream: each is mutually exclusive with its *_tokens
# counterpart (setting both is a hard error in _validate_duration_config /
# _validate_resume_config_modes), so an uncommented template would fail on
# every generated config.
#
# They must still appear in the published reference: `train_tokens` is the ONLY
# duration knob the warmup_stable / cosine / linear schedules accept, and the
# *_steps fields are the only step-based alternative to the token budgets.
# emit.build_surface() folds these into the named section's `properties` after
# the template has been parsed.
#
# Shape:
#   surface -> section -> field -> {type, default, description,
#                                   advanced, backend, enum, minimum, maximum}
#
# `default: null` mirrors the dataclass (`Optional[int] = None`) and matches how
# the eval dataclass surface already emits Optional fields: real type from the
# annotation, JSON-null default.
# =============================================================================
x-extra-fields:
  pretrain:
    pretraining:
      eval_mlm_probability:
        type: number
        default: null
        advanced: true
        group: MLM
        description: >-
          Masking rate used for EVAL only. null means "same as training", which
          is the historical behaviour. Set it when ablating mlm_probability:
          otherwise an arm trained at 15% is also scored at 15% while the base
          is scored at 30%, which are different tasks whose losses cannot be
          compared.
      eval_mask_replace_prob:
        type: number
        default: null
        advanced: true
        group: MLM
        description: >-
          Eval-only share of masked positions replaced with [MASK]. null means
          "same as training". Pin it alongside eval_mlm_probability when
          ablating the 80/10/10 split.
      eval_random_token_prob:
        type: number
        default: null
        advanced: true
        group: MLM
        description: >-
          Eval-only share of masked positions replaced with a random amino
          acid. null means "same as training".
      eval_keep_probability:
        type: number
        default: null
        advanced: true
        group: MLM
        description: >-
          Eval-only share of masked positions left unchanged. null means "same
          as training".
      eval_mlm_masking_strategy:
        type: string
        default: null
        advanced: true
        group: MLM
        enum: [token, span]
        description: >-
          Eval-only masking strategy. null means "same as training". Pin it
          when ablating mlm_masking_strategy, for the same reason as
          eval_mlm_probability.
      eval_mask_seed:
        type: integer
        default: null
        advanced: true
        group: MLM
        description: >-
          Seed for eval masking. When set, an eval batch's mask is seeded from
          the batch's token ids, so it is stable across runs and dataloader
          worker counts for the same eval loader and world size; it depends on
          batch composition. Leave null to draw fresh masks from global RNG on
          every eval, which adds mask noise to every reported eval loss.
      train_tokens:
        type: integer
        default: null
        advanced: true
        group: Duration + LR schedule
        description: >-
          Total token budget for the single-phase schedules (lr_schedule:
          warmup_stable | cosine | linear), the only token budget those
          schedules accept. Mutually exclusive with max_steps: set exactly one
          of them, never both. Must NOT be combined with lr_schedule: wsd, which
          takes stable_tokens/decay_tokens instead. Shipped commented out by
          `nanoplm pretrain get-yaml` because that template defaults to wsd.
      max_steps:
        type: integer
        default: null
        advanced: true
        group: Duration + LR schedule
        description: >-
          Step-based override for train_tokens (lr_schedule: warmup_stable |
          cosine | linear): train for this many optimizer steps instead of for a
          token budget. Set exactly one of train_tokens or max_steps, never
          both; neither is valid with lr_schedule: wsd.
      max_wallclock_hours:
        type: number
        default: null
        advanced: true
        group: Logging, eval, checkpoints
        description: >-
          Wall-clock budget for training, in hours. The run writes a checkpoint
          and stops at the first optimizer step past the deadline, even if the
          token budget is not spent, which is how wall-clock-matched ablations
          are run. The clock starts a couple of optimizer steps in so that
          torch.compile, autotuning and warmup are excluded, meaning total job
          time is longer than the budget; it also restarts on resume rather than
          accumulating across resumes. Unset (the default) runs the full token
          budget.
      peak_tflops:
        type: number
        default: null
        advanced: true
        group: Logging, eval, checkpoints
        description: >-
          Device peak BF16 tensor-core throughput in TFLOP/s, used as the
          denominator of the reported MFU. Unset (the default) uses the H100 SXM
          figure of 989.4, which is wrong for any other accelerator: on a GH200
          booster capped at 630 it understates MFU by 1.57x. Set it per cluster
          so the logged MFU means what it says. Affects reporting only, never
          the computation.
      stable_steps:
        type: integer
        default: null
        advanced: true
        group: Duration + LR schedule
        description: >-
          Step-based override for stable_tokens (lr_schedule: wsd only): number
          of optimizer steps up to the pre-decay checkpoint, warmup included.
          Set exactly one of stable_tokens or stable_steps, never both.
      decay_steps:
        type: integer
        default: null
        advanced: true
        group: Duration + LR schedule
        description: >-
          Step-based override for decay_tokens (lr_schedule: wsd only): number
          of additional anneal optimizer steps after the stable phase. Set
          exactly one of decay_tokens or decay_steps, never both.
      compile_mode:
        type: string
        default: null
        advanced: true
        backend: [pure_torch]
        group: torch.compile knobs (pure_torch only)
        enum: [default, reduce-overhead, max-autotune, max-autotune-no-cudagraphs]
        description: >-
          Explicit mode passed to torch.compile for the training graph. Unset
          (the default) compiles in Inductor's default mode, or in
          max-autotune-no-cudagraphs when use_compile_max_autotune is true;
          setting this field overrides that flag. reduce-overhead enables CUDA
          graphs, which cuts per-step launch overhead on a CPU-dispatch-bound
          step but costs extra VRAM for the graph pools and re-records when
          input addresses or shapes change. max-autotune adds CUDA graphs on top
          of kernel autotuning; max-autotune-no-cudagraphs autotunes only.
          Shipped commented out by `nanoplm pretrain get-yaml` because the
          default mode is the right choice for an ordinary run.
      debug_memory_snapshot:
        type: boolean
        default: false
        advanced: true
        backend: [pure_torch]
        group: Debug
        description: >-
          Record the CUDA caching allocator's history (allocation stacks and
          compile context) for the whole run and write it as a pickle that
          https://docs.pytorch.org/memory_viz renders, which is how a VRAM peak
          gets attributed to saved activations, all-gather buffers, optimizer
          state or fragmentation instead of guessed at. A pickle is written when
          a torch.OutOfMemoryError escapes the training loop (the error then
          propagates unchanged) and after debug_memory_snapshot_step. Every rank
          records. The scheduled dump is written by LOCAL_RANK 0; an OOM dump is
          written by whichever rank hit it, because an OOM is rank-local. Files
          land in <run root>/memory_snapshots/rank<RANK>_<tag>.pickle, that is,
          in the run directory the job creates under ckp_dir. Recording
          captures a Python stack per allocation, so leave it off for throughput
          measurements. Shipped commented out by `nanoplm pretrain get-yaml`.
      debug_memory_snapshot_step:
        type: integer
        default: -1
        advanced: true
        backend: [pure_torch]
        group: Debug
        description: >-
          Also dump a memory snapshot right after this optimizer step, giving a
          reference picture of a step that fits to compare against the OOM dump.
          -1 (the default) dumps only on an out-of-memory error. Ignored unless
          debug_memory_snapshot is true. Shipped commented out by `nanoplm
          pretrain get-yaml`.
      debug_memory_snapshot_max_entries:
        type: integer
        default: 100000
        minimum: 1
        advanced: true
        backend: [pure_torch]
        group: Debug
        description: >-
          Number of allocator events kept in the memory-history ring buffer;
          older events are dropped. Lower it if the pickles get unwieldy, raise
          it if the OOM dump no longer reaches back to the allocations that
          built the peak. Ignored unless debug_memory_snapshot is true. Shipped
          commented out by `nanoplm pretrain get-yaml`.
      profiler_record_shapes:
        type: boolean
        default: false
        advanced: true
        backend: [pure_torch]
        group: Profiler
        description: >-
          Record per-operator input shapes in the PyTorch profiler trace. Shape
          recording adds bookkeeping on the dispatch path, which is the path a
          CPU-bound step is limited by, so a trace taken with it on overstates
          step time and must not be read as a steady-state wall-clock reference.
          Turn it on only to attribute kernels to tensor shapes. Ignored unless
          profiler_enabled is true. Shipped commented out by `nanoplm pretrain
          get-yaml`.
    resume:
      decay_steps:
        type: integer
        default: null
        advanced: true
        group: "Decay-mode fields (omit / null for mode: continue)"
        description: >-
          (mode: decay) Step-based override for resume.decay_tokens: number of
          additional anneal optimizer steps to run from the checkpoint. Set
          exactly one of decay_tokens or decay_steps, never both. mode: continue
          accepts no decay_* field at all.
  # The source keys the data template ships commented out
  # (data_config.SOURCE_KEYS).
  data:
    sources:
      prepared:
        type: string
        description: >-
          A folder another data.yaml built, used as it is. Set fasta or prepared,
          not both. A prepared source takes no data_params overrides and no
          cluster_subsampling.
      cluster_subsampling:
        type: object
        description: >-
          Turns on cluster subsampling for this source: each epoch trains on one
          random member of every cluster. The block being present turns it on;
          delete or comment it out to turn it off. max_seqs and val_ratio then
          count clusters, not sequences.
        properties:
          # cluster_config.resolve_cluster_plan: null = this source's fasta.
          # Required: the block needs members (data_config._cluster_block).
          members:
            type: [string, "null"]
            description: >-
              uniref90, uniref100, a UniRef90/100 FASTA URL/path, or null (= this
              source's fasta). Required.
          # cluster_config.CLUSTERINGS
          clustering:
            type: string
            default: auto
            enum: [auto, uniprot, mmseqs2]
            description: >-
              auto: UniProt clusters for UniRef data, MMseqs2 otherwise; or
              uniprot, mmseqs2
          # cluster_config._fraction: a number in (0, 1]; 0 itself is rejected
          identity:
            type: number
            default: 0.5
            exclusiveMinimum: 0
            maximum: 1
            description: "mmseqs2 only: min sequence identity within a cluster"
          coverage:
            type: number
            default: 0.8
            exclusiveMinimum: 0
            maximum: 1
            description: "mmseqs2 only: min alignment coverage"
  distill:
    distillation:
      adam_beta1:
        type: number
        default: 0.9
        advanced: true
        description: >-
          AdamW beta1 (first-moment decay). Used by the AdamW optimizer, and by
          the AdamW sub-optimizer that handles 1-D / embedding params when
          optimizer is muon or normuon.
      adam_beta2:
        type: number
        default: 0.999
        advanced: true
        description: >-
          AdamW beta2 (second-moment decay). Used by the AdamW optimizer, and by
          the AdamW sub-optimizer that handles 1-D / embedding params when
          optimizer is muon or normuon.
      adam_epsilon:
        type: number
        default: 1.0e-8
        advanced: true
        description: >-
          AdamW epsilon (denominator stability term). Used by the AdamW
          optimizer, and by the AdamW sub-optimizer that handles 1-D / embedding
          params when optimizer is muon or normuon.
